<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de CNPJs</title>
<style>
  /* Layout: coluna única, formulário no topo, uma ficha por CNPJ abaixo */
  :root {
    --fundo: #f3f5f4; --papel: #ffffff; --texto: #17211d; --suave: #5b6963;
    --linha: #d5dcd8; --acento: #0b6b4f; --acento-texto: #ffffff;
    --ok: #0b6b4f; --alerta: #a35a00; --erro: #a32222;
    --fonte: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #111614; --papel: #1a211e; --texto: #e7edea; --suave: #9aa8a2;
      --linha: #2f3a35; --acento: #4fc39c; --acento-texto: #08130f;
      --ok: #4fc39c; --alerta: #e5a550; --erro: #f08a8a; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font: 16px/1.5 var(--fonte); padding: 32px 16px 64px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
  h1 { font-size: 1.6rem; margin: 0; }
  .sub { color: var(--suave); margin: 4px 0 0; }
  form { background: var(--papel); border: 1px solid var(--linha);
         border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
  .campos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--suave); }
  input { font: 1.05rem var(--mono); padding: 10px 12px; width: 100%;
          border: 1px solid var(--linha); border-radius: 6px;
          background: var(--fundo); color: var(--texto); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  input.invalido { border-color: var(--erro); }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: 600 1rem var(--fonte); padding: 10px 20px; border-radius: 6px;
           border: 1px solid var(--acento); background: var(--acento);
           color: var(--acento-texto); cursor: pointer; }
  button.secundario { background: transparent; color: var(--acento); }
  button:disabled { opacity: .55; cursor: wait; }
  #aviso { color: var(--suave); font-size: .9rem; }
  #resultados { display: grid; gap: 16px; }
  .ficha { background: var(--papel); border: 1px solid var(--linha);
           border-radius: 10px; padding: 20px; display: grid; gap: 12px; }
  .ficha h2 { font-size: 1.15rem; margin: 0; overflow-wrap: anywhere; }
  .topo { display: flex; gap: 10px; justify-content: space-between; align-items: start; flex-wrap: wrap; }
  .num { font-family: var(--mono); color: var(--suave); }
  .selo { font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 99px;
          border: 1px solid currentColor; white-space: nowrap; }
  .selo.ok { color: var(--ok); } dd.sit-ok { color: var(--ok); font-weight: 600; } dd.sit-mal { color: var(--erro); font-weight: 600; } .selo.alerta { color: var(--alerta); } .selo.erro { color: var(--erro); }
  dl { margin: 0; display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 6px 14px; }
  dt { color: var(--suave); font-size: .88rem; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .msg-erro { color: var(--erro); margin: 0; }
  .cad { border-top: 1px solid var(--linha); padding-top: 14px; display: grid; gap: 10px; }
  .cad p { margin: 0; }
  .cad .titulo { font-weight: 600; }
  .cad .ok { color: var(--ok); font-weight: 600; }
  .cad .alerta { color: var(--alerta); }
  .cad .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .cad select { font: 1rem var(--fonte); padding: 9px 10px; border: 1px solid var(--linha);
                border-radius: 6px; background: var(--fundo); color: var(--texto); }
  a.botao { justify-self: start; display: inline-block; font: 600 1rem var(--fonte); padding: 10px 20px; border-radius: 6px;
            background: var(--acento); color: var(--acento-texto); text-decoration: none; }
  @media (max-width: 480px) { dl { grid-template-columns: 1fr; gap: 0; } dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Consulta de CNPJs</h1>
    <p class="sub">Digite até três CNPJs. Os dados vêm da ReceitaWS. <a href="./" style="color:var(--acento);font-weight:600">← Voltar ao Gestor de Carteira</a> · <a href="https://agricopel.portaldocliente.online/?redirect_url=%2Fdashboard" target="portalcliente" rel="noopener" style="color:var(--acento);font-weight:600">Portal do cliente</a></p>
  </header>

  <form id="form" novalidate>
    <div class="campos">
      <label>1º CNPJ <input id="c1" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" maxlength="18"></label>
      <label>2º CNPJ <input id="c2" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" maxlength="18"></label>
      <label>3º CNPJ <input id="c3" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" maxlength="18"></label>
    </div>
    <div class="acoes">
      <button id="btn" type="submit">Consultar</button>
      <button id="copiar" type="button" class="secundario" hidden>Copiar resultados</button>
      <span id="aviso" role="status"></span>
    </div>
  </form>

  <section id="resultados" aria-live="polite"></section>
</main>

<script>
(function () {
  var BASE = "https://receitaws.com.br/v1/cnpj/";
  var LIMITE = 3, JANELA = 60000;       // API pública: 3 consultas por minuto
  var feitas = [];                       // horários das consultas já enviadas
  var textoCopia = [];
  var $ = function (id) { return document.getElementById(id); };
  var campos = [$("c1"), $("c2"), $("c3")];

  function limpar(v) { return (v || "").replace(/[^0-9A-Za-z]/g, "").toUpperCase(); }

  function formatar(c) {
    c = limpar(c).slice(0, 14);
    var p = [c.slice(0, 2), c.slice(2, 5), c.slice(5, 8), c.slice(8, 12), c.slice(12, 14)];
    var s = p[0];
    if (p[1]) s += "." + p[1];
    if (p[2]) s += "." + p[2];
    if (p[3]) s += "/" + p[3];
    if (p[4]) s += "-" + p[4];
    return s;
  }

  // Dígitos verificadores (módulo 11); vale para CNPJ numérico e alfanumérico
  function valido(c) {
    c = limpar(c);
    if (!/^[0-9A-Z]{12}[0-9]{2}$/.test(c) || /^(.)\1+$/.test(c)) return false;
    function dv(base) {
      var soma = 0, peso = 2;
      for (var i = base.length - 1; i >= 0; i--) {
        soma += (base.charCodeAt(i) - 48) * peso;
        peso = peso === 9 ? 2 : peso + 1;
      }
      var r = soma % 11;
      return r < 2 ? "0" : String(11 - r);
    }
    var d1 = dv(c.slice(0, 12));
    return c.slice(12) === d1 + dv(c.slice(0, 12) + d1);
  }

  campos.forEach(function (el) {
    el.addEventListener("input", function () { el.value = formatar(el.value); el.classList.remove("invalido"); });
  });

  // A ReceitaWS aceita o parâmetro "callback" (JSONP), que funciona direto do navegador
  var seq = 0;
  function consultar(cnpj) {
    return new Promise(function (resolve, reject) {
      var nome = "__cnpj_cb_" + Date.now() + "_" + (seq++);
      var s = document.createElement("script");
      var relogio = setTimeout(function () { fim(); reject(new Error("tempo")); }, 25000);
      function fim() { clearTimeout(relogio); delete window[nome]; s.remove(); }
      window[nome] = function (dados) { fim(); resolve(dados); };
      s.onerror = function () { fim(); reject(new Error("rede")); };
      s.src = BASE + cnpj + "?callback=" + nome;
      document.head.appendChild(s);
    });
  }

  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function fichaErro(cnpj, msg) {
    var f = el("article", "ficha");
    var t = el("div", "topo");
    t.appendChild(el("span", "num", formatar(cnpj)));
    t.appendChild(el("span", "selo erro", "Sem resultado"));
    f.appendChild(t);
    f.appendChild(el("p", "msg-erro", msg));
    textoCopia.push(formatar(cnpj) + "\n" + msg);
    return f;
  }

  // Guarda a situação na Receita para o Gestor de Carteira mostrar na ficha do cliente
  function guardaSituacao(cnpj, d, esp) {
    try {
      var k = String(d.cnpj || cnpj).replace(/\D/g, "");
      if (k.length !== 14) return;
      var h = new Date(), hoje = h.getFullYear() + "-" + ("0" + (h.getMonth() + 1)).slice(-2) + "-" + ("0" + h.getDate()).slice(-2);
      var m = JSON.parse(localStorage.getItem("postos_sit_cnpj") || "{}") || {};
      m[k] = [String(d.situacao || "").trim().toUpperCase(), String(esp || "").toUpperCase(), hoje].join("|");
      localStorage.setItem("postos_sit_cnpj", JSON.stringify(m));
    } catch (e) {}
  }

  // ---------- Cadastro no Gestor de Carteira ----------
  // O Gestor grava em "postos_indice_cnpj" os CNPJs que já tem (apagados vêm como cnpj*código).
  // Aqui o cadastro entra numa fila; o Gestor lê a fila ao abrir e salva o cliente no Drive.
  var FILA = "postos_cadastro_fila";
  function indice() {
    var m = {};
    try {
      String(localStorage.getItem("postos_indice_cnpj") || "").split(",").forEach(function (x) {
        if (!x) return; var i = x.indexOf("*");
        if (i < 0) m[x] = {}; else m[x.slice(0, i)] = { ck: x.slice(i + 1) };
      });
    } catch (e) {}
    return m;
  }
  function lerFila() { try { var f = JSON.parse(localStorage.getItem(FILA) || "[]"); return Array.isArray(f) ? f : []; } catch (e) { return []; } }
  function naFila(dg) { return lerFila().some(function (x) { return x && x.cnpj === dg; }); }
  function poeNaFila(item) {
    var f = lerFila().filter(function (x) { return x && x.cnpj !== item.cnpj; });
    f.push(item);
    try { localStorage.setItem(FILA, JSON.stringify(f)); return true; } catch (e) { return false; }
  }
  // Celular com 10 dígitos (DDD + 8) ganha o 9 na frente
  function telefones(t) {
    return String(t || "").split(/[\/,;]/).map(function (x) { return x.replace(/\D/g, ""); })
      .filter(function (x) { return x.length === 10 || x.length === 11; })
      .map(function (x) { return x.length === 10 && /[6-9]/.test(x[2]) ? x.slice(0, 2) + "9" + x.slice(2) : x; });
  }
  function linkFicha(dg, txt) { var a = el("a", "botao", txt || "Abrir a ficha no Gestor"); a.href = "./#c" + dg; return a; }
  function pronto(box, dg, msg) {
    box.textContent = "";
    box.appendChild(el("p", "ok", msg));
    box.appendChild(el("p", null, "Ao abrir o Gestor, o cliente entra na base e vai para o Drive. Cadastrou mais de um? Use o filtro Tipo de Cliente › Cadastrados pela Consulta de CNPJs."));
    box.appendChild(linkFicha(dg));
  }

  function blocoCadastro(cnpj, d, esp) {
    var box = el("div", "cad");
    var dg = String(d.cnpj || cnpj).replace(/[^0-9A-Za-z]/g, "").toUpperCase();
    if (!/^\d{14}$/.test(dg)) {
      box.appendChild(el("p", "alerta", "CNPJ alfanumérico: o Gestor ainda não aceita cadastro automático deste formato."));
      return box;
    }
    var idx = indice()[dg];
    if (idx && !idx.ck) {
      box.appendChild(el("p", "ok", "✓ Este CNPJ já está no Gestor de Carteira."));
      box.appendChild(linkFicha(dg));
      return box;
    }
    if (naFila(dg)) { pronto(box, dg, "✓ Cadastro já preparado. Falta abrir o Gestor."); return box; }
    if (idx && idx.ck) {
      box.appendChild(el("p", "alerta", "Este CNPJ está na lixeira do Gestor (registro apagado)."));
      var r = el("button", null, "Restaurar e abrir no Gestor"); r.type = "button";
      r.addEventListener("click", function () {
        if (!poeNaFila({ cnpj: dg, restaurar: idx.ck })) { box.appendChild(el("p", "msg-erro", "Sem espaço no navegador para guardar o pedido.")); return; }
        location.href = "./#c" + dg;
      });
      box.appendChild(r);
      return box;
    }

    var ativ = (d.atividade_principal || [])[0] || {};
    var cod = String(ativ.code || "").replace(/\D/g, "");
    var revenda = /^(4731|4732|4681)/.test(cod);   // varejo de combustíveis/lubrificantes ou atacado de combustíveis
    box.appendChild(el("p", "titulo", "Este CNPJ não está no Gestor de Carteira."));
    if (String(d.situacao || "").toUpperCase() !== "ATIVA" || esp)
      box.appendChild(el("p", "alerta", "Atenção: a situação na Receita não é regular" + (esp ? " (" + esp + ")" : "") + ". Dá para cadastrar mesmo assim."));
    var linha = el("div", "linha");
    var lb = el("label", null, "Tipo de cliente");
    var sel = el("select");
    [["revendedor", "Revendedor (posto)"], ["consumidor", "Consumidor (frota)"]].forEach(function (o) {
      var op = el("option", null, o[1]); op.value = o[0]; sel.appendChild(op);
    });
    sel.value = revenda ? "revendedor" : "consumidor";
    lb.appendChild(sel);
    var b = el("button", null, "Cadastrar no Gestor de Carteira"); b.type = "button";
    linha.appendChild(lb); linha.appendChild(b);
    box.appendChild(linha);
    box.appendChild(el("p", "sub", "Tipo sugerido pela atividade principal" + (ativ.code ? " (" + ativ.code + ")" : "") + ". Confira antes de cadastrar."));

    b.addEventListener("click", function () {
      var cap = parseFloat(d.capital_social);
      var item = {
        cnpj: dg, tipo: sel.value, nome: d.nome || "", fantasia: d.fantasia || "",
        municipio: d.municipio || "", uf: d.uf || "", segmento: ativ.text || "",
        end: { endereco: [d.logradouro, d.numero].filter(Boolean).join(", "), compl: d.complemento || "", bairro: d.bairro || "", cep: d.cep || "" },
        tels: telefones(d.telefone), email: d.email || "",
        capital: isFinite(cap) && cap > 0 ? cap.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ""
      };
      if (!poeNaFila(item)) { box.appendChild(el("p", "msg-erro", "Sem espaço no navegador para guardar o cadastro.")); return; }
      pronto(box, dg, "✓ " + (d.nome || "Cliente") + " pronto para entrar no Gestor como " + (sel.value === "revendedor" ? "revendedor (posto)." : "consumidor (frota)."));
    });
    return box;
  }

  function fichaOk(cnpj, d) {
    var f = el("article", "ficha");
    var t = el("div", "topo");
    var esq = el("div");
    esq.appendChild(el("h2", null, d.nome || "(sem razão social)"));
    esq.appendChild(el("span", "num", d.cnpj || formatar(cnpj)));
    t.appendChild(esq);
    var sit = (d.situacao || "").toUpperCase();
    t.appendChild(el("span", "selo " + (sit === "ATIVA" ? "ok" : "erro"), sit === "ATIVA" ? "ATIVA" : sit ? "INATIVA (" + sit + ")" : "Situação não informada"));
    var esp = String(d.situacao_especial || "").replace(/\*/g, "").trim();
    if (esp) t.appendChild(el("span", "selo alerta", /RECUPERA..O JUDICIAL/i.test(esp) ? "Em recuperação judicial" : esp));
    f.appendChild(t);
    guardaSituacao(cnpj, d, esp);

    var endereco = [
      [d.logradouro, d.numero].filter(Boolean).join(", "), d.complemento, d.bairro,
      [d.municipio, d.uf].filter(Boolean).join("/"), d.cep ? "CEP " + d.cep : ""
    ].filter(Boolean).join(" · ");
    var ativ = (d.atividade_principal || []).map(function (a) { return [a.code, a.text].filter(Boolean).join(" "); }).join("; ");
    var socios = (d.qsa || []).map(function (s) { return s.nome + (s.qual ? " (" + s.qual + ")" : ""); }).join("; ");
    var capital = d.capital_social ? "R$ " + Number(d.capital_social).toLocaleString("pt-BR", { minimumFractionDigits: 2 }) : "";

    var rj = /RECUPERA..O JUDICIAL/i.test(esp);
    var sitTxt = (sit === "ATIVA" ? "Ativa" : sit ? "Inativa (" + sit.toLowerCase() + ")" + (d.motivo_situacao ? " – " + d.motivo_situacao : "") : "Não informada")
      + (d.data_situacao ? ", desde " + d.data_situacao : "")
      + (rj ? " · EM RECUPERAÇÃO JUDICIAL" + (d.data_situacao_especial ? " desde " + d.data_situacao_especial : "") : esp ? " · " + esp : "");
    var linhas = [
      ["Situação na Receita", sitTxt],
      ["Nome fantasia", d.fantasia], ["Abertura", d.abertura], ["Tipo", d.tipo], ["Porte", d.porte],
      ["Natureza jurídica", d.natureza_juridica], ["Atividade principal", ativ], ["Endereço", endereco],
      ["Telefone", d.telefone], ["E-mail", d.email], ["Capital social", capital], ["Sócios", socios],
      ["Atualizado em", d.ultima_atualizacao ? new Date(d.ultima_atualizacao).toLocaleDateString("pt-BR") : ""]
    ].filter(function (l) { return l[1]; });

    var dl = el("dl");
    var copia = [(d.nome || "") + " — " + (d.cnpj || formatar(cnpj)), "Situação: " + (d.situacao || "")];
    linhas.forEach(function (l) {
      dl.appendChild(el("dt", null, l[0]));
      dl.appendChild(el("dd", l[0] === "Situação na Receita" ? (sit === "ATIVA" && !esp ? "sit-ok" : "sit-mal") : null, l[1]));
      copia.push(l[0] + ": " + l[1]);
    });
    f.appendChild(dl);
    f.appendChild(blocoCadastro(cnpj, d, esp));
    textoCopia.push(copia.join("\n"));
    return f;
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var lista = [], erro = false;
    campos.forEach(function (c) {
      var v = limpar(c.value);
      if (!v) return;
      if (!valido(v)) { c.classList.add("invalido"); erro = true; return; }
      if (lista.indexOf(v) < 0) lista.push(v);
    });
    if (erro) { $("aviso").textContent = "Confira o CNPJ em vermelho: os dígitos não conferem."; return; }
    if (!lista.length) { $("aviso").textContent = "Digite pelo menos um CNPJ."; return; }

    var agora = Date.now();
    feitas = feitas.filter(function (t) { return agora - t < JANELA; });
    if (feitas.length + lista.length > LIMITE) {
      var espera = Math.ceil((JANELA - (agora - feitas[0])) / 1000);
      $("aviso").textContent = "A ReceitaWS aceita 3 consultas por minuto. Tente de novo em " + espera + " s.";
      return;
    }

    $("btn").disabled = true;
    $("copiar").hidden = true;
    $("aviso").textContent = "Consultando…";
    $("resultados").textContent = "";
    textoCopia = [];
    lista.forEach(function () { feitas.push(Date.now()); });

    Promise.all(lista.map(function (c) {
      return consultar(c).then(
        function (d) {
          if (String(d && d.status).toUpperCase() === "ERROR") return fichaErro(c, d.message || "A ReceitaWS não devolveu dados para este CNPJ.");
          return fichaOk(c, d);
        },
        function () {
          return fichaErro(c, "A ReceitaWS não respondeu. Pode ser o limite de 3 consultas por minuto ou falha de conexão. Aguarde um minuto e tente de novo.");
        }
      );
    })).then(function (fichas) {
      fichas.forEach(function (f) { $("resultados").appendChild(f); });
      $("btn").disabled = false;
      $("copiar").hidden = false;
      $("aviso").textContent = "";
    });
  });

  // Aberto pelo app com ?cnpj=...: preenche e consulta sozinho
  var vindos = new URLSearchParams(location.search).getAll("cnpj").join(",").split(",").map(limpar).filter(Boolean).slice(0, 3);
  if (vindos.length) {
    vindos.forEach(function (c, i) { campos[i].value = formatar(c); });
    $("form").dispatchEvent(new Event("submit", { cancelable: true }));
  }

  $("copiar").addEventListener("click", function () {
    var txt = textoCopia.join("\n\n");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      function () { $("aviso").textContent = "Resultados copiados."; },
      function () { $("aviso").textContent = "Não foi possível copiar. Selecione o texto e use Ctrl+C."; }
    );
  });
})();
</script>
</body>
</html>
